# ══════════════════════════════════════════════════════════════
# ERP Seem Semrac — stack Docker locale (app + Supabase auto-hébergé)
# ──────────────────────────────────────────────────────────────
# Dérivé du docker-compose OFFICIEL Supabase (self-hosting), CURÉ pour un
# usage DEV LOCAL : on garde db + rest (PostgREST) + kong (passerelle) +
# storage (GED) + meta/studio (dashboard). On RETIRE realtime, supavisor
# (pooler), edge-functions et gotrue (l'ERP a sa PROPRE authentification
# matricule+PIN, il n'utilise pas GoTrue), superflus et plus fragiles sur un PC.
#
# Lancer :   cd docker && cp .env.example .env  (une fois)  puis  docker compose up -d
# Cœur qui DOIT être vert : db, rest, kong, app.  studio/storage = confort.
# ══════════════════════════════════════════════════════════════
name: erp-seem-semrac

services:

  # ─── Base de données PostgreSQL (image Supabase : rôles + extensions) ───
  db:
    container_name: erp-db
    # Image = Postgres Supabase + scripts d'init cuits dedans (voir db.Dockerfile).
    # Pas de bind-mount de fichiers : ils deviennent des dossiers vides sur Windows.
    build:
      context: .
      dockerfile: db.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Postgres exposé sur l'hôte en 54322 (pour psql / pg_dump / restauration).
      # POSTGRES_BIND permet de restreindre l'écoute : « 127.0.0.1:54322 » = VM seule.
      - "${POSTGRES_BIND:-54322}:5432"
    volumes:
      # Données persistées entre redémarrages (volumes NOMMÉS = fiables sur Windows).
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  # ─── Migrations de SCHÉMA (conteneur éphémère : applique puis s'arrête) ───
  # Les scripts de /docker-entrypoint-initdb.d/ ne sont joués QUE sur une base vide.
  # Sur une VM déjà en service, une nouvelle colonne n'arrivait donc jamais : le code
  # se mettait à jour, le schéma non. Ce conteneur rejoue db/migrations/ à chaque
  # démarrage, uniquement les fichiers jamais appliqués (journal : _erp_migrations).
  # ⚠ Il REFUSE toute migration destructrice — voir db/migrations/README.md.
  migrate:
    container_name: erp-migrate
    build:
      context: .
      dockerfile: migrate.Dockerfile
    restart: "no"          # travail ponctuel : il applique, il sort.
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGUSER: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}

  # ─── PostgREST : l'API REST que @supabase/supabase-js utilise (.from()) ───
  rest:
    container_name: erp-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # ─── Kong : passerelle API (préfixes /rest/v1, /storage/v1, apikey) ───
  kong:
    container_name: erp-kong
    # Image = Kong + kong.yml + entrypoint cuits dedans (voir kong.Dockerfile).
    build:
      context: .
      dockerfile: kong.Dockerfile
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api-gw
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Passerelle + dashboard Studio : http://localhost:8000
      - "${KONG_HTTP_PORT}:8000/tcp"
      - "${KONG_HTTPS_PORT}:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  # ─── Storage : le bucket "ged" (documents/plans CAO/FAO) ───
  imgproxy:
    container_name: erp-imgproxy
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    volumes:
      - storage-data:/var/lib/storage

  storage:
    container_name: erp-storage
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - storage-data:/var/lib/storage

  # ─── postgres-meta + Studio : le dashboard Supabase (http://localhost:8000) ───
  meta:
    container_name: erp-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    container_name: erp-studio
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  # ─── L'APPLICATION ERP (Hono/Node) ───
  app:
    container_name: erp-app
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_healthy
      # ⚠ PAS de dependance sur `migrate` : une migration qui echoue ne doit JAMAIS
      #   empecher l'ERP de demarrer. Un schema en retard est un desagrement, un ERP
      #   a terre est un arret de travail — et le code est fail-soft sur les colonnes
      #   absentes (sondes de capacite, .catch, repli majDaDraft).
    environment:
      PORT: 3000
      # L'app parle à Supabase par la passerelle Kong INTERNE au réseau Docker.
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      # Authentification PROPRE de l'ERP (indépendante de Supabase).
      AUTH_ENFORCE: ${AUTH_ENFORCE:-off}
      JWT_SECRET: ${APP_JWT_SECRET}
      BOOTSTRAP_MATRICULE: ${BOOTSTRAP_MATRICULE:-ADMIN}
      BOOTSTRAP_PIN: ${BOOTSTRAP_PIN:-0000}
    ports:
      - "${APP_PORT:-3000}:3000"
    # Pas de bind-mount de src/ : sur ce poste Windows, les bind-mounts (fichiers ET
    # dossiers) depuis E:\ arrivent VIDES dans le conteneur. On exécute donc le code
    # CUIT dans l'image (COPY au build). Mettre à jour après une modif de src/ :
    #   docker compose up -d --build app     (reconstruction ~10s, cache npm réutilisé)
    command: ["npm", "run", "start:node"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/login').then((r) => {if (r.status >= 500) throw new Error(r.status)})\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  db-data:        # données PostgreSQL (volume nommé = robuste sur Windows)
  db-config:
  storage-data:   # fichiers du bucket GED (partagé storage + imgproxy)

networks:
  default:
    name: erp-seem-semrac
